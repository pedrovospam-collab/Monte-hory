<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Infografika 1 — Batoh horolezce</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Quicksand', Verdana, sans-serif; }

    @media print {
      @page { size: 420mm 594mm; margin: 0; }
      body { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    @media screen {
      body { background: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    }

    .poster {
      width: 420mm;
      height: 594mm;
      background: #fff;
      padding: 15mm 20mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    @media screen {
      .poster { box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    }

    .title {
      text-align: center;
      font-size: 18mm;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1mm;
      color: #222;
      padding-bottom: 10mm;
    }

    .backpack-area {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .backpack-svg {
      width: 200mm;
      height: 350mm;
    }

    /* Labels with lines */
    .label-box {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 3mm;
    }

    .label-box .label-text {
      background: #fff;
      border: 0.5mm solid #333;
      border-radius: 3mm;
      padding: 3mm 5mm;
      font-size: 6mm;
      font-weight: 700;
      text-transform: uppercase;
      color: #222;
      white-space: nowrap;
    }

    .label-box .label-icon {
      width: 18mm;
      height: 18mm;
      flex-shrink: 0;
    }

    .label-line {
      position: absolute;
      border-top: 0.8mm solid #555;
    }

    /* Bottom climber pictogram */
    .bottom-icon {
      padding-top: 8mm;
    }
    .bottom-icon svg {
      width: 30mm;
      height: 30mm;
    }
  </style>
</head>
<body>

  <div class="poster">
    <div class="title">Batoh horolezce</div>

    <div class="backpack-area">

      <!-- Batoh SVG -->
      <svg class="backpack-svg" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
        <!-- Popruhy -->
        <path d="M120 200 Q100 350 110 550" stroke="#c62828" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M280 200 Q300 350 290 550" stroke="#c62828" stroke-width="12" fill="none" stroke-linecap="round"/>

        <!-- Hlavní tělo batohu -->
        <rect x="100" y="120" width="200" height="420" rx="30" fill="#e53935"/>
        <rect x="100" y="120" width="200" height="420" rx="30" fill="none" stroke="#b71c1c" stroke-width="3"/>

        <!-- Horní klopa -->
        <rect x="90" y="90" width="220" height="80" rx="20" fill="#c62828"/>
        <rect x="90" y="90" width="220" height="80" rx="20" fill="none" stroke="#b71c1c" stroke-width="2"/>

        <!-- Přezka klopy -->
        <rect x="175" y="160" width="50" height="15" rx="4" fill="#ffc107"/>
        <rect x="185" y="163" width="30" height="9" rx="2" fill="#f57f17"/>

        <!-- Přední kapsa -->
        <rect x="130" y="350" width="140" height="120" rx="15" fill="#c62828"/>
        <rect x="130" y="350" width="140" height="120" rx="15" fill="none" stroke="#b71c1c" stroke-width="2"/>
        <line x1="200" y1="395" x2="200" y2="415" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

        <!-- Zip přední kapsy -->
        <path d="M170 350 Q200 340 230 350" stroke="#ffc107" stroke-width="3" fill="none"/>
        <circle cx="230" cy="350" r="4" fill="#ffc107"/>

        <!-- Boční kapsy -->
        <rect x="80" y="300" width="30" height="100" rx="10" fill="#c62828" stroke="#b71c1c" stroke-width="2"/>
        <rect x="290" y="300" width="30" height="100" rx="10" fill="#c62828" stroke="#b71c1c" stroke-width="2"/>

        <!-- Spodní úchyty -->
        <ellipse cx="140" cy="560" rx="15" ry="8" fill="#b71c1c"/>
        <ellipse cx="260" cy="560" rx="15" ry="8" fill="#b71c1c"/>

        <!-- ===== PŘEDMĚTY V/NA BATOHU ===== -->

        <!-- 1. Lano (svinuté nahoře) -->
        <ellipse cx="200" cy="80" rx="55" ry="22" fill="none" stroke="#ffc107" stroke-width="8"/>
        <ellipse cx="200" cy="80" rx="55" ry="22" fill="none" stroke="#ffecb3" stroke-width="3"/>

        <!-- 2. Karabiny (na boku) -->
        <g transform="translate(310, 260)">
          <path d="M0 0 Q-5 20 0 40 Q5 42 10 40 Q15 20 10 0 Q5 -2 0 0" fill="none" stroke="#78909c" stroke-width="4"/>
          <rect x="2" y="15" width="6" height="12" rx="1" fill="#78909c"/>
        </g>
        <g transform="translate(325, 280)">
          <path d="M0 0 Q-5 20 0 40 Q5 42 10 40 Q15 20 10 0 Q5 -2 0 0" fill="none" stroke="#78909c" stroke-width="4"/>
          <rect x="2" y="15" width="6" height="12" rx="1" fill="#78909c"/>
        </g>

        <!-- 3. Přilba (přicvaknutá zepředu) -->
        <g transform="translate(155, 230)">
          <ellipse cx="45" cy="30" rx="42" ry="28" fill="#42a5f5"/>
          <path d="M5 35 Q45 55 85 35" fill="none" stroke="#1565c0" stroke-width="3"/>
          <circle cx="45" cy="18" r="5" fill="#bbdefb"/>
        </g>

        <!-- 4. Čelovka (v přilbě) -->
        <g transform="translate(185, 237)">
          <rect x="-8" y="0" width="16" height="10" rx="3" fill="#333"/>
          <circle cx="0" cy="5" r="4" fill="#ffc107"/>
        </g>

        <!-- 5. Lahev (v boční kapse) -->
        <g transform="translate(82, 305)">
          <rect x="4" y="15" width="22" height="65" rx="8" fill="#2196f3"/>
          <rect x="8" y="5" width="14" height="14" rx="4" fill="#1565c0"/>
        </g>

        <!-- 6. Lékárnička (v přední kapse, viditelný kříž) -->
        <g transform="translate(170, 380)">
          <rect x="0" y="0" width="60" height="45" rx="5" fill="#fff" opacity="0.3"/>
          <rect x="22" y="5" width="16" height="35" rx="1" fill="#fff" opacity="0.5"/>
          <rect x="10" y="15" width="40" height="15" rx="1" fill="#fff" opacity="0.5"/>
        </g>
      </svg>

      <!-- POPISKY S ČARAMI -->

      <!-- 1. Lano - nahoře vlevo -->
      <div class="label-box" style="top: 10%; left: 5%;">
        <div class="label-text">Lano</div>
      </div>
      <div class="label-line" style="top: 13%; left: 18%; width: 20%;"></div>

      <!-- 2. Karabiny - vpravo -->
      <div class="label-box" style="top: 38%; right: 3%;">
        <div class="label-text">Karabiny</div>
      </div>
      <div class="label-line" style="top: 40%; right: 18%; width: 12%;"></div>

      <!-- 3. Přilba - vlevo -->
      <div class="label-box" style="top: 33%; left: 3%;">
        <div class="label-text">Přilba</div>
      </div>
      <div class="label-line" style="top: 36%; left: 16%; width: 18%;"></div>

      <!-- 4. Čelovka - vpravo nahoře -->
      <div class="label-box" style="top: 28%; right: 3%;">
        <div class="label-text">Čelovka</div>
      </div>
      <div class="label-line" style="top: 30.5%; right: 18%; width: 18%;"></div>

      <!-- 5. Lahev - vlevo dole -->
      <div class="label-box" style="top: 50%; left: 3%;">
        <div class="label-text">Lahev s vodou</div>
      </div>
      <div class="label-line" style="top: 52%; left: 24%; width: 10%;"></div>

      <!-- 6. Lékárnička - vpravo dole -->
      <div class="label-box" style="top: 58%; right: 3%;">
        <div class="label-text">Lékárnička</div>
      </div>
      <div class="label-line" style="top: 60%; right: 18%; width: 14%;"></div>

    </div>

    <!-- Piktogram horolezce dole -->
    <div class="bottom-icon">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="15" r="10" fill="#555"/>
        <line x1="50" y1="25" x2="50" y2="60" stroke="#555" stroke-width="5" stroke-linecap="round"/>
        <line x1="50" y1="60" x2="35" y2="85" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="60" x2="65" y2="85" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="38" x2="30" y2="50" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="38" x2="70" y2="50" stroke="#555" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

  </div>

</body>
</html>
